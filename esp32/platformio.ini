; libastromech ESP32 implementation.
;   pio run                 build every example for the board
;   pio run -e r2_demo -t upload
;   pio test -e native      host-side protocol/config unit tests (no hardware)
;
; The project root is the library itself; each example env compiles src/ plus
; one examples/<name>/ directory. Consumers of the library use library.json.

[platformio]
src_dir = .
default_envs = r2_demo, bb_demo, beacon, r2t2_beeps

[env]
build_flags = -Isrc -std=gnu++17 -Wall -Wextra
build_unflags = -std=gnu++11

[esp32_common]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = h2zero/NimBLE-Arduino@~2.5.2

; Set the droid address / beacon identity per board, e.g.
;   pio run -e r2_demo -t upload   with DROID_MAC edited below or via
;   PLATFORMIO_BUILD_FLAGS='-DDROID_MAC=\"AA:BB:CC:DD:EE:FF\"'
[env:r2_demo]
extends = esp32_common
build_src_filter = -<*> +<src/*.cpp> +<examples/r2_demo/>
build_flags = ${env.build_flags} -DDROID_MAC=\"F7:E6:74:95:E5:53\" -DDROID_PERSONALITY=\"resistance_blue\"

[env:bb_demo]
extends = esp32_common
build_src_filter = -<*> +<src/*.cpp> +<examples/bb_demo/>
build_flags = ${env.build_flags} -DDROID_MAC=\"E6:1C:86:B3:BD:AE\" -DDROID_PERSONALITY=\"smuggler_blue\"

; Bring-up driver: beeps R2-T2 (MAC hard-coded in the source) on every power-on.
;   pio run -e r2t2_beeps -t upload && pio device monitor
[env:r2t2_beeps]
extends = esp32_common
build_src_filter = -<*> +<src/*.cpp> +<examples/r2t2_beeps/>

[env:beacon]
extends = esp32_common
build_src_filter = -<*> +<src/*.cpp> +<examples/beacon/>

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<src/astromech_protocol.cpp>
